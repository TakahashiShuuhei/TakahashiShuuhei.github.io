<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>丸サ イントロ 練習プラン</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="index.html">
<div class="toolbar"><div class="in">
  <label><input type="checkbox" id="tg-jp"> ドレミ表記</label>
  <label><input type="checkbox" id="tg-col" checked> 譜面の色分け</label>
  <label>テンポ
    <select id="tg-bpm"><option>50</option><option>60</option><option>80</option><option>100</option><option>120</option></select>
  </label>
  <button class="btn" id="btn-stop">■ 停止</button>
  <span class="prog" id="prog"></span>
</div></div>

<div class="wrap">
<header>
  <h1>丸の内サディスティック(藤井風ver.)イントロ 練習プラン</h1>
  <p>「弾けるけど何を考えて弾いているか分からない」を、コード → コードトーン → テンション → フレーズの順に分解して理解する。</p>
  <nav class="tabs" id="tabs"></nav>
</header>

<details class="panel" id="map" open>
  <summary>コード進行の地図(8小節)</summary>
  <p class="small" style="margin:8px 0 0">A major 基準の度数(Ⅳ△7→Ⅲ7→Ⅵm7→Ⅰ7 =「丸サ進行」)。※ intro.json から機械的に推定したコードです。</p>
  <div class="strip" id="strip"></div>
  <div class="legend" style="margin-top:12px">
    <span><span class="dot" style="background:var(--ct)"></span>コードトーン</span>
    <span><span class="dot" style="background:var(--ten)"></span>テンション</span>
    <span><span class="dot" style="background:var(--pass)"></span>経過音・装飾</span>
    <span><span class="dot" style="background:var(--lh)"></span>左手</span>
  </div>
  <p style="margin:12px 0 0"><button class="btn main" id="btn-all">▶ イントロ全体を再生</button>
    </p>
</details>
<div id="toc"></div>
<nav class="pager" id="pager"></nav>

<footer>データ元: intro.json(小節 2-9)。譜面は VexFlow で描画。音価は各音の開始位置から機械的に切っているので、実際の伸ばしとは少し異なります。</footer>
</div>

<script src="vendor/vexflow.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
